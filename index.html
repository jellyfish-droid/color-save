<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Utility Pro - Standardized</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f8f9fa; padding: 40px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        
        #toast {
            visibility: hidden; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; z-index: 1000; transition: opacity 0.3s; opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }

        .converter { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; background: #333; color: white; font-weight: bold; }
        
        .color-info { display: flex; gap: 20px; font-size: 14px; color: #666; background: #f9f9f9; padding: 15px; border-radius: 10px; white-space: nowrap; overflow-x: auto; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .color-card { 
            aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.3s ease; position: relative; user-select: none;
            /* 關鍵：強制使用 sRGB 色彩空間顯示 */
            background-color: color(srgb 0 0 0); 
        }
        .color-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .color-card.deleting { background: #ff4d4f !important; color: white; font-weight: bold; border: 2px dashed white; }
        
        .color-code { opacity: 0; transition: opacity 0.3s; font-weight: 700; font-size: 12px; pointer-events: none; }
        .color-card:hover .color-code { opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Copied to clipboard!</div>

<div class="container">
    <div class="converter">
        <h3>Color Utility</h3>
        <div class="input-group">
            <input type="text" id="hexInput" placeholder="e.g., #FF5733" oninput="updateConverter()">
            <button onclick="saveColor()">Save</button>
        </div>
        <div class="color-info" id="output">
            <span>RGB: -</span>
            <span>CMYK: -</span>
        </div>
        <p style="font-size: 12px; color: #999; margin-top: 10px;">Right-click to delete. Click elsewhere to cancel.</p>
    </div>
    <div class="grid" id="colorGrid"></div>
</div>

<script>
    window.onload = renderColors;

    // 將 Hex 轉換為 RGB 比例 (0-1) 以符合 color(srgb r g b) 格式
    function hexToSrgb(hex) {
        let r = parseInt(hex.slice(1,3), 16) / 255;
        let g = parseInt(hex.slice(3,5), 16) / 255;
        let b = parseInt(hex.slice(5,7), 16) / 255;
        return `color(srgb ${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)})`;
    }

    function renderColors() {
        const grid = document.getElementById('colorGrid');
        grid.innerHTML = '';
        const colors = JSON.parse(localStorage.getItem('myColors') || '[]');
        
        colors.forEach(hex => {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.setAttribute('data-hex', hex);
            // 使用標準化 sRGB 顯示
            card.style.backgroundColor = hexToSrgb(hex);
            
            card.onclick = (e) => {
                e.stopPropagation();
                if (card.classList.contains('deleting')) {
                    let colors = JSON.parse(localStorage.getItem('myColors') || '[]');
                    colors = colors.filter(c => c !== hex);
                    localStorage.setItem('myColors', JSON.stringify(colors));
                    renderColors();
                    showToast("Deleted!");
                } else {
                    document.querySelectorAll('.color-card').forEach(c => c.classList.remove('deleting'));
                    navigator.clipboard.writeText(hex);
                    showToast("Copied to clipboard!");
                }
            };
            
            card.oncontextmenu = (e) => {
                e.preventDefault();
                e.stopPropagation();
                document.querySelectorAll('.color-card').forEach(c => c.classList.remove('deleting'));
                card.classList.add('deleting');
                card.innerHTML = "DELETE";
            };
            
            card.innerHTML = `<span class="color-code" style="color: ${getComplementary(hex)}">${hex.toUpperCase()}</span>`;
            grid.appendChild(card);
        });
    }

    function getComplementary(hex) {
        let r = 255 - parseInt(hex.slice(1,3), 16);
        let g = 255 - parseInt(hex.slice(3,5), 16);
        let b = 255 - parseInt(hex.slice(5,7), 16);
        return `rgb(${r}, ${g}, ${b})`;
    }

    function updateConverter() {
        const hex = document.getElementById('hexInput').value;
        if (!/^#[0-9A-F]{6}$/i.test(hex)) return;
        
        let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
        let c = 1-(r/255), m = 1-(g/255), y = 1-(b/255);
        let k = Math.min(c, m, y);
        c = Math.round(((c-k)/(1-k)||0)*100);
        m = Math.round(((m-k)/(1-k)||0)*100);
        y = Math.round(((y-k)/(1-k)||0)*100);
        k = Math.round(k*100);
        document.getElementById('output').innerHTML = `<span>RGB: (${r}, ${g}, ${b})</span> <span>CMYK: (${c}%, ${m}%, ${y}%, ${k}%)</span>`;
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => { toast.className = ""; }, 2000);
    }
</script>
</body>
</html>
