<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Utility Pro - Stable</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f8f9fa; padding: 40px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        
        #toast { visibility: hidden; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 1000; transition: opacity 0.3s; opacity: 0; }
        #toast.show { visibility: visible; opacity: 1; }

        .converter { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 8px; background: #333; color: white; font-weight: bold; }
        
        .color-info { display: flex; gap: 20px; font-size: 14px; color: #666; background: #f9f9f9; padding: 15px; border-radius: 10px; white-space: nowrap; overflow-x: auto; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .color-card { 
            aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.3s ease; position: relative; user-select: none;
        }
        .color-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .color-card.deleting { background: #ff4d4f !important; color: white; font-weight: bold; border: 2px dashed white; }
        
        .color-code { opacity: 0; transition: opacity 0.3s; font-weight: 700; font-size: 12px; pointer-events: none; }
        .color-card:hover .color-code { opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Action completed!</div>

<div class="container">
    <div class="converter">
        <h3>Color Utility</h3>
        <div class="input-group">
            <input type="text" id="hexInput" placeholder="e.g., #FF5733">
            <button onclick="saveColor()">Save</button>
        </div>
        <div class="color-info" id="output"><span>RGB: -</span> <span>CMYK: -</span></div>
    </div>
    <div class="grid" id="colorGrid"></div>
</div>

<script>
    // 1. 初始化讀取
    window.onload = () => {
        renderColors();
        document.getElementById('hexInput').addEventListener('input', updateConverter);
    };

    // 2. 核心儲存邏輯
    function saveColor() {
        const hex = document.getElementById('hexInput').value.trim();
        if (!/^#[0-9A-F]{6}$/i.test(hex)) return alert("Invalid HEX format! Use #RRGGBB");
        
        const colors = JSON.parse(localStorage.getItem('myColors') || '[]');
        if (colors.includes(hex.toUpperCase())) return showToast("Already saved!");
        
        colors.push(hex.toUpperCase());
        localStorage.setItem('myColors', JSON.stringify(colors));
        document.getElementById('hexInput').value = '';
        renderColors();
        showToast("Color saved!");
    }

    // 3. 渲染邏輯
    function renderColors() {
        const grid = document.getElementById('colorGrid');
        grid.innerHTML = '';
        const colors = JSON.parse(localStorage.getItem('myColors') || '[]');
        
        colors.forEach(hex => {
            const card = document.createElement('div');
            card.className = 'color-card';
            card.style.backgroundColor = hex;
            
            card.onclick = (e) => {
                if (card.classList.contains('deleting')) {
                    deleteColor(hex);
                } else {
                    navigator.clipboard.writeText(hex);
                    showToast("Copied!");
                }
            };
            
            card.oncontextmenu = (e) => {
                e.preventDefault();
                document.querySelectorAll('.color-card').forEach(c => c.classList.remove('deleting'));
                card.classList.add('deleting');
                card.innerText = "DELETE";
            };
            
            if (!card.classList.contains('deleting')) {
                card.innerHTML = `<span class="color-code" style="color: ${getComp(hex)}">${hex}</span>`;
            }
            grid.appendChild(card);
        });
    }

    function deleteColor(hex) {
        let colors = JSON.parse(localStorage.getItem('myColors') || '[]');
        colors = colors.filter(c => c !== hex);
        localStorage.setItem('myColors', JSON.stringify(colors));
        renderColors();
        showToast("Deleted!");
    }

    function getComp(hex) {
        return `rgb(${255-parseInt(hex.slice(1,3),16)}, ${255-parseInt(hex.slice(3,5),16)}, ${255-parseInt(hex.slice(5,7),16)})`;
    }

    function updateConverter() {
        const hex = document.getElementById('hexInput').value;
        if (!/^#[0-9A-F]{6}$/i.test(hex)) return;
        let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        document.getElementById('output').innerHTML = `<span>RGB: (${r}, ${g}, ${b})</span>`;
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg; toast.className = "show";
        setTimeout(() => { toast.className = ""; }, 2000);
    }

    // 點擊空白處重置刪除狀態
    document.addEventListener('click', (e) => {
        if (!e.target.classList.contains('color-card')) renderColors();
    });
</script>
</body>
</html>
